spring:
  application:
    name: xai-studymate-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xai_studymate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

# ── Application Config ──────────────────────────────────────────────
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000   # 24 hours

  ai-service:
    base-url: ${APP_AI_SERVICE_BASE_URL:http://localhost:5000}

  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"

logging:
  level:
    com.xaistudymate: DEBUG
    org.springframework.security: INFO
