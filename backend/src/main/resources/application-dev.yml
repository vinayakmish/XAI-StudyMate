# ── Dev Profile — H2 file-based database (no PostgreSQL needed) ──────
app:
  jwt:
    secret: ${APP_JWT_SECRET:bG9jYWwtZGV2LW9ubHkteGFpLXN0dWR5bWF0ZS1qd3Qtc2VjcmV0LTIwMjY=}

spring:
  datasource:
    url: jdbc:h2:file:./data/xai_studymate_dev;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.xaistudymate: INFO
    org.springframework.security: WARN
