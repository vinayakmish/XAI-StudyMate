databases:
  - name: xai-studymate-db
    databaseName: xai_studymate
    user: xai_studymate
    plan: free

services:
  - type: web
    name: xai-studymate-ai
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./ai-service/Dockerfile
    healthCheckPath: /health

  - type: web
    name: xai-studymate-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${{xai-studymate-db.host}}:${{xai-studymate-db.port}}/${{xai-studymate-db.database}}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: xai-studymate-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: xai-studymate-db
          property: password
      - key: APP_AI_SERVICE_BASE_URL
        value: http://${{xai-studymate-ai.hostport}}
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
